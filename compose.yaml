name: dawaisathi-dev
services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: appadmin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Run python scripts/init-docker.py dev first}
    volumes:
      - mongo-data:/data/db
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ping:1}).ok" | grep 1']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      MONGO_URL: mongodb://appadmin:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      DB_NAME: dawaisathi_dev
      DAWAISATHI_AUTH_SECRET: ${DAWAISATHI_AUTH_SECRET:?Initialize Docker secrets first}
      DAWAISATHI_BOOTSTRAP_TOKEN: ${DAWAISATHI_BOOTSTRAP_TOKEN:?Initialize Docker secrets first}
      CORS_ORIGINS: http://localhost:18081,http://127.0.0.1:18081
    ports: ["127.0.0.1:18000:8000"]
    volumes: [media-data:/app/data]
    networks: [default, database]
    depends_on:
      mongo: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore: [.venv/, data/, tests/, __pycache__/, '.env*', '*.env', '*.bak*']
        - action: rebuild
          path: ./backend/requirements-docker.txt
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    environment:
      EXPO_PUBLIC_BACKEND_URL_WEB: http://127.0.0.1:18000
    ports: ["127.0.0.1:18081:8081"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore: [node_modules/, .expo/, .metro-cache/, dist/, '.env*', '*.env', package.json, yarn.lock, '*backup*/', '*recovery*/', '*.bak*']
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/yarn.lock
    restart: unless-stopped
  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      MONGO_URL: mongodb://appadmin:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      DB_NAME: dawaisathi_test_container
      DAWAISATHI_AUTH_SECRET: ${DAWAISATHI_AUTH_SECRET}
      DAWAISATHI_BOOTSTRAP_TOKEN: ${DAWAISATHI_BOOTSTRAP_TOKEN}
    networks: [database]
    depends_on:
      mongo: {condition: service_healthy}
networks:
  database:
    internal: true
volumes:
  mongo-data:
  media-data:
