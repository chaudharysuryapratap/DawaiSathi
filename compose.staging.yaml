name: dawaisathi-staging
services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: appadmin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Initialize separate staging secrets first}
    volumes: [mongo-data:/data/db]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ping:1}).ok" | grep 1']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      MONGO_URL: mongodb://appadmin:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      DB_NAME: dawaisathi_staging
      DAWAISATHI_AUTH_SECRET: ${DAWAISATHI_AUTH_SECRET:?Initialize separate staging secrets first}
      # Empty after owner registration; a fresh database then fails closed.
      DAWAISATHI_BOOTSTRAP_TOKEN: ${DAWAISATHI_BOOTSTRAP_TOKEN:-}
      CORS_ORIGINS: ${APP_URL:-http://localhost:18088}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
    volumes: [media-data:/app/data]
    networks: [default, database]
    depends_on:
      mongo: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: web
      args:
        EXPO_PUBLIC_BACKEND_URL_WEB: ""
        EXPO_PUBLIC_APP_URL: ${APP_URL:-http://localhost:18088}
        EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
    ports: ["127.0.0.1:18088:8080"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
networks:
  database:
    internal: true
volumes:
  mongo-data:
  media-data:
